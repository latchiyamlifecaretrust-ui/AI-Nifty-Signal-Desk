
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle is missing"
            exit 1
          fi
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle is missing"
            exit 1
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk" -ls
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -size +100k -print -quit 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "ERROR: Valid APK not found."
            echo "Check Gradle configuration and build output."
            exit 1
          fi
          echo "APK verified:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nifty-Signal-Desk-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
